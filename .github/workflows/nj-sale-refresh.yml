name: NJ Sale Refresh

on:
  schedule:
    # 11:00 UTC (6–7 AM Eastern) on the 1st and 15th of each month.
    - cron: "0 11 1,15 * *"
  workflow_dispatch:
    inputs:
      skip_zillow:
        description: "Skip the paid Apify Zillow stage"
        type: boolean
        default: false
      max_zillow_addresses:
        description: "Refuse a Zillow run larger than this many addresses"
        type: number
        default: 400

permissions:
  contents: read

concurrency:
  group: nj-sale-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run NJ Sale Refresh
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
        run: |
          args=(--run-dir "$RUNNER_TEMP/nj-sale-refresh" --max-zillow-addresses "${{ inputs.max_zillow_addresses || 400 }}")
          if [ "${{ inputs.skip_zillow }}" = "true" ]; then args+=(--skip-zillow); fi
          python -m pipeline.nj_sale_refresh "${args[@]}"

      # The run log holds addresses and party names, so it stays on the runner;
      # report.json has counts only.
      - name: Keep the count report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nj-sale-refresh-report
          path: ${{ runner.temp }}/nj-sale-refresh/report.json
          if-no-files-found: ignore
          retention-days: 90
